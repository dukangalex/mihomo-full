    "rule-set:bilibili": *CN_DNS
    "geosite:cn": *CN_DNS
    # ── 补强：更宽泛的国内域名兜底（减少冷门国内域名走代理解析）──
    "+.cn": *CN_DNS
    "+.com.cn": *CN_DNS
    "+.net.cn": *CN_DNS
    "+.org.cn": *CN_DNS
    "+.edu.cn": *CN_DNS
