# Clash Meta (Mihomo) 配置 · FINAL v5
# 目标：中国大陆用户 · 境内全直连 · 境外链式代理（机场入口 + 自建VPS落地）
# 零泄露（宁可断网也不泄露） · 零误判 · 零风控隐患 · 高隐匿 · 国内流量无感
#
# ── 本版本相对早期 PATCH 版本的关键变更（供以后回来自己核对）──
# 1. empty-fallback: REJECT 已从全部分组移除
#    实测确认 FlClash/Bettbox 绑定的 mihomo 核心不识别这个字段，
#    会导致整份配置直接加载失败。CMFA（跑 Alpha 开发分支）能识别，
#    但为保证三个客户端通用，统一不使用。不要再加回来。
# 2. tun.exclude-package 已移除，原因与上面相同（同样导致加载失败），
#    且该字段对设备级 VPN 接口检测（banking App 风控）本来就无效，
#    银行 App 的直连保障靠 rules 里的 PROCESS-NAME-WILDCARD 兜底。
# 3. 全部 rule-provider 与 geox-url 下载源统一使用 gcore.jsdelivr.net，
#    不用 testingcf.jsdelivr.net——后者在国内的可用性会不定期被单独
#    干扰，历史上已经因此导致过多次加载失败（EOF / rule set not found）。
#    如果 gcore 哪天也不通了，参考同一域名下 fastly/cdn 等其他 jsDelivr
#    边缘节点做替换，全局替换一个域名字符串即可。
# 4. QUIC 嗅探已关闭（sniffer.sniff.QUIC.enable: false）。P7 的境外 QUIC
#    封堵靠 RULE-SET,cn-ip 做 IP 段判断，不依赖嗅探结果，关闭嗅探不影响
#    封堵效果，同时彻底消除历史上 QUIC sniffer 的崩溃漏洞攻击面，不再
#    需要关注"内核版本是否 ≥v1.19.27"这件事。
# 5. 远程控制/内网穿透工具（Tailscale/AnyDesk/RustDesk/frp等）不再是硬编码
#    DIRECT 或 REJECT-DROP，改指向一个叫"远控工具"的 select 分组，默认
#    选中 REJECT-DROP（安全默认，收窄"进程名可被伪造绕开代理"这个信任
#    盲区）。真要用这类工具时，直接在 FlClash/Bettbox 的分组切换界面里
#    把"远控工具"这个分组手动选成 DIRECT 即可，不用再回来改 YAML。
# 6. log-level 设为 info（而非更省日志的 warning/error）——用户主动选择
#    "日志量最大，换取以后排查问题的能力"这个权衡，如果观感上日志太吵，
#    可以自行调回 warning。
# 7. 节点协议不再做自动排除。
#    VMess、Shadowsocks、Trojan、VLESS、Hysteria/Hysteria2、TUIC 等
#    均保留；是否可用由实际链式测试、服务端配置和节点来源决定。
#    前置机场同样不按协议/线路名称过滤。
# 8. inet4-route-only 改为 false（原为 true）。原设置下 TUN 只接管
#    IPv4 路由，操作系统若有能用的原生 IPv6 出口，IPv6 流量会完全
#    绕过 TUN、绕过 rules 里 P1 的 IPv6 封堵规则，是个从未被真正
#    验证过的潜在泄露口——大陆手机 IPv6 部署本就不完整，这条隐患
#    过去概率低，但现在要在 Windows/macOS 家宽环境用（IPv6 双栈
#    很常见），风险显著上升，因此关闭。
# 9. secret 字段是占位符，必须自己在设备本地生成替换，不要把生成的值
#    粘贴回任何对话——旧密钥已经在聊天记录里出现过，按最佳实践视为已
#    泄露，不能继续用。
#
# 落地 VPS 是自建，IP 地理声誉需要自己定期抽查
# （ipinfo.io / MaxMind demo 页面，看有没有被误判成中国相关），
# 这件事配置文件管不到，纯粹是 IP 自身历史声誉决定的服务端判断。


mode: rule
allow-lan: false
bind-address: "127.0.0.1"
mixed-port: 17890  # 非默认端口，防止本地恶意应用定位
log-level: info  # 日志量最大，换取以后排查问题的能力（权衡：会留存更多本地日志细节）
ipv6: false
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
keep-alive-idle: 15
disable-keep-alive: false
find-process-mode: strict
etag-support: true

external-controller: 127.0.0.1:19090
secret: "必须替换】终端执行 openssl rand -hex 32 生成新密钥，直接填入设备本地的这份文件"

# CORS 防护：只允许本地 origin，彻底断绝远程利用路径
# yacd.haishan.me / metacubexd.pages.dev 是外部 CDN 域名
# 若 CDN 被劫持或投毒，其 JS 可通过 CORS 读取本地控制器数据
# 总统专机级安全：只保留 127.0.0.1 和 localhost
external-controller-cors:
  allow-origins:
    - "http://127.0.0.1:19090"
    - "https://127.0.0.1:19090"
    - "http://localhost:19090"
    - "https://localhost:19090"
  allow-private-network: false

profile:
  store-selected: false  # 安全优先：不持久化节点选择，防止代理节点信息被检查
  store-fake-ip: false   # 唯一生效的 fake-ip 持久化开关（安全优先，不持久化访问记录）；需跨重启保持改 true

geodata-mode: false
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 168   # 7天，与 rule-providers interval 协同

geox-url:
  # 原直接指向 github.com release 直链，跟其余 57 个 rule-provider 一样存在
  # 国内可用性不稳定的风险（github.com release 会重定向到
  # objects.githubusercontent.com，同类问题）。这四个文件是 GEOSITE/GEOIP
  # 基础匹配库，比单个规则集更关键——一旦下载失败，"GEOSITE,cn,DIRECT"/
  # "GEOIP,CN,DIRECT" 这类兜底规则会连带失效。改用 meta-rules-dat 官方
  # 提供的 jsDelivr 镜像（@release 分支，整包文件），与其余规则集统一走
  # 同一个已验证可用的 CDN 边缘节点。
  geoip:   "https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb:    "https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  asn:     "https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

# 使用较中性的 Chrome UA，避免在 Windows/macOS 上出现明显的 Android 指纹。
# 如主要只在 Android 使用，可改回 Pixel 专用 UA。
global-ua: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

experimental:
  quic-go-disable-gso: false
  quic-go-disable-ecn: false

# NTP 已禁用（Android 系统自带 NTP 足够，明文 UDP 暴露流量特征）
ntp:
  enable: false
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 30

tun:
  enable: true
  stack: mixed
  auto-route: true
  # auto-redirect 关闭：这是 Linux 专属特性(靠 iptables 做流量重定向)，
  # 在 Windows/macOS/Android 上都没有对应机制、不起作用，属于死字段。
  # 之前 exclude-package 已经因为"某平台专属字段在其他客户端上引发解析
  # 问题"踩过坑，现在要跑 Windows/macOS/Android 三个平台，这种平台专属
  # 但又用不上的字段直接关掉更安全，不留隐患。
  auto-redirect: false
  strict-route: true           # 严格路由：防止流量绕过 TUN
  auto-detect-interface: true
  # inet4-route-only 改为 false：原来是 true，含义是 TUN 只接管 IPv4
  # 路由，IPv6 完全不碰——如果这台设备的操作系统有能用的原生 IPv6 出口，
  # IPv6 流量会直接走系统路由绕过 TUN，rules 里 P1 那条
  # "IP-CIDR6,::/0,REJECT-DROP" 只能拦住进了 TUN 的流量，从来没进 TUN
  # 的 IPv6 连接完全拦不到，等于一条摆设。大陆手机 IPv6 部署本来就不完整，
  # 这条隐患过去概率低；现在要在 Windows/macOS 家宽环境用（IPv6 双栈很
  # 常见），风险从"理论上"变成"大概率真实存在"。改成 false 后 TUN 会把
  # IPv6 路由也接管，P1 的封堵规则才能真正拦到全部 IPv6 流量，而不是被
  # 绕过。
  inet4-route-only: false
  mtu: 1500  # 标准以太网 MTU，消除 TUN 网卡指纹特征
  # gso 改为 false：规避 Alpha 分支已确认但 stable 分支(含 v1.19.29)尚未修复的
  # "tun dns hijack sending zero-filled or stale packets when PackBuffer reallocates"
  # 该问题可能导致过期/损坏的 DNS 应答被用于路由分类判断，后果不是断网而是
  # 可能把本该走代理的境外域名误判直连——属于真实泄露风险而非单纯故障，
  # 在官方 stable 修复落地前关闭 GSO 换取正确性优先于吞吐量。
  gso: false
  gso-max-size: 65536
  udp-timeout: 300
  dns-hijack:
    - any:53
    - tcp://any:53
  # exclude-package 字段已再次移除：实测确认 FlClash/Bettbox 绑定的
  # mihomo 核心版本不识别这个字段，会导致整份配置直接加载失败。
  # 该字段即便生效，对设备级 VPN 接口检测（农行掌上银行的实测情况）
  # 也无法解决，去掉不损失实际防护——银行 App 的直连保障已经由
  # rules 里的 PROCESS-NAME-WILDCARD 规则在路由层兜底。如需针对
  # 个别银行 App 做系统层面 VPN 排除，请改用 FlClash/Bettbox App 内
  # 自带的"应用分流/分应用代理"GUI 设置，不要在 YAML 里配置这个字段。

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      enable: true
      override-destination: true
    TLS:
      ports: [443, 8443]
      enable: true
      override-destination: true
  force-domain:
    - "+.google.com"
    - "+.youtube.com"
    - "+.telegram.org"
    - "+.openai.com"
    - "+.anthropic.com"
    - "+.twitter.com"
    - "+.x.com"
    - "+.googlevideo.com"
    - "+.ytimg.com"
    - "+.chatgpt.com"
    - "+.claude.ai"
  # Telegram 官方 IP 段跳过嗅探（MTProto 加密协议，TLS 嗅探会失败产生噪音日志）
  skip-dst-address:
    - "91.105.192.0/23"
    - "91.108.4.0/22"
    - "91.108.8.0/21"
    - "91.108.16.0/21"
    - "91.108.56.0/22"
    - "95.161.64.0/20"
    - "149.154.160.0/20"
    - "185.76.151.0/24"
  skip-domain:
    - "geosite:cn"
    - "geosite:geolocation-cn"       # 国内域名不做嗅探，减少性能开销
    - "geosite:category-ads-all"
    - "geosite:category-games-cn"    # 国内游戏域名跳过嗅探
    # Android / Windows / Apple 网络连通性检测域名，跳过嗅探防误判
    - "+.gstatic.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.captive.apple.com"
    # 路由器后台管理域名，跳过嗅探防卡顿
    - "+.router.asus.com"
    - "+.tplogin.cn"
    - "+.hiwifi.com"
    - "+.phicomm.me"
    # 局域网设备，防嗅探死循环
    - "+.local"
    - "+.lan"
    - "+.home.arpa"
    # ── 银行/金融/反诈域名跳过 TLS 嗅探 ──────────────────────
    # 关键：sniffer 对这些域名做 TLS 解析会被银行检测为"中间人劫持"
    # 跳过后 TLS 握手端到端，银行无法感知 Mihomo 的存在
    - "+.unionpay.com"             # 银联
