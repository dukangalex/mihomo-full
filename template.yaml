proxy-providers:

  provider_entry_J:
    type: http
    url: "__AIRPORT_SUB_URL__"  # 前置入口订阅
    proxy: DIRECT
    interval: 3600
    path: ./proxy_providers/entry_J.yaml
    override:
      client-fingerprint: chrome
      udp: true
      ip-version: dual
    health-check:
      enable: true
      lazy: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      expected-status: 204

  provider_exit:
    type: http
    url: "__EXIT_NODES_URL__"  # 落地出口订阅
    proxy: DIRECT
    interval: 3600
    path: ./proxy_providers/exit.yaml
    override:
      client-fingerprint: chrome
      dialer-proxy: "前置优选入口"   # 链式代理：出口经入口转发
      udp: true
      ip-version: dual
    health-check:
      enable: true
      lazy: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 8000
      expected-status: 204

proxy-groups:

  - name: "前置优选入口"
    type: url-test
    use: [provider_entry_J]
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 300
    tolerance: 60
    lazy: true
    timeout: 5000
    max-failed-times: 3
    empty-fallback: REJECT  # 前置入口全灭时返回 REJECT（fail-closed），绝不退化为明文直连

  - name: "落地优选出口"
    type: url-test
    use: [provider_exit]
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 600
    tolerance: 35
    lazy: true
    timeout: 8000
    max-failed-times: 3
    empty-fallback: REJECT

  - name: "落地负载均衡"
    type: load-balance
    strategy: consistent-hashing
    use: [provider_exit]
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 600
    lazy: true
    timeout: 8000
    empty-fallback: REJECT

  - name: "落地手动选择"
    type: select
    use: [provider_exit]
    empty-fallback: REJECT

  - name: "AI服务"
    type: select
    proxies:
      - 落地优选出口
      - 落地负载均衡
      - 落地手动选择

  - name: "Claude"
    type: select
    proxies:
      - 落地优选出口
      - 落地负载均衡
      - 落地手动选择

  - name: "国外服务"
    type: select
    proxies:
      - 落地优选出口
      - 落地负载均衡
      - 落地手动选择

  - name: "流媒体"
    type: select
    proxies:
      - 落地优选出口
      - 落地负载均衡
      - 落地手动选择

  - name: "漏网之鱼"
    type: select
    proxies:
      - 落地优选出口
      - 落地负载均衡
      - 落地手动选择

  - name: "🛑 广告拦截"
    type: select
    proxies: ["REJECT-DROP", "REJECT", "DIRECT"]

  - name: "远控工具"
    type: select
    proxies: ["REJECT-DROP", "落地优选出口", "DIRECT"]

