  # 进程名可以被伪造——恶意软件只要把自己命名成"tailscale"/"frpc"这类
  # 名字，就能利用这条规则绕开整个代理隧道，所以默认状态必须是拦截。
  # 但硬编码 REJECT-DROP 意味着真要用这类工具时得回来改 YAML、重新导入
