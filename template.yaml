# Clash Meta (Mihomo) 配置 · FINAL v7.2 (Mihomo v1.19.33 · IPv6 Dual-Stack)
# 目标：中国大陆用户 · 境内全直连 · 境外链式代理（机场入口 + 自建VPS落地）
# 零泄露（宁可断网也不泄露） · 零误判 · 零风控隐患 · 高隐匿 · 国内流量无感
# IPv6 全面双栈支持（v6 变更：ipv6=true, dns.ipv6=true,
#   fake-ip-range6, proxy-providers ip-version=dual,
#   P1 由全封堵改为精细化 IPv6 路由，新增 cn-ip/private-ip 规则集）
#
# ── v7.2 关键审计与修复变更（2026-10）──
# 10. [修复] P1 与 DOMESTIC_IP 中的 IPv6 ULA 路由由 fc00::/7 收窄为标准分配段 fd00::/8，
#     防止 fc00::/18 的 IPv6 Fake-IP 被提前截获并强制 DIRECT 直连导致 IPv6 代理黑洞。
# 11. [修复] P5/P5.6/P6/P7 内的 AND 嵌套 (RULE-SET,cn-ip) 全部补齐 no-resolve，
#     消除带域名的 UDP 443 (QUIC) 及非常规端口连接在规则前半段触发同步阻塞式 DNS 解析。
# 12. [修复] 进程规则（PROCESS-NAME-WILDCARD）由 P12 整体上移至 P1.8（域名与 IP 规则之前），
#     确保银行 App 直连及"远控工具"分组拦截优先裁决，不被国内域名/IP 规则提前放行。
# 13. [修复] 移除 P1 顶层的 RULE-SET,cn-ip,DIRECT,no-resolve（交由 P11 DOMESTIC_IP 统一处理），
#     使 P8 的 AWS 境外伪装段（三星推送/FCM 裸 IP）强制代理规则恢复生效。
# 14. [修复] default-nameserver 与 direct-nameserver 移除 Cloudflare IPv6 (2606:4700:4700::1111)，
#     仅保留国内阿里 IPv6 DoT/DoH，防止国内解析并发抢答导致 CDN 调度至境外或直连超时。
# 15. [优化] 关闭 respect-rules: false，境外 DoH 统一通过 #国外服务 显式绑定出站策略组，
#     彻底消除 DNS 查詢重入规则树引发的循环依赖；合并 nameserver-policy 同构锚点，清理冗余规则。
# 16. [对齐] 内核基线升到稳定版 v1.19.33（含 CVE-2026-97031：畸形 ECH 可耗尽进程内存）。
#     不跟 Alpha。tun.dns-mode 故意留空：写 hijack 时 Linux 还要 auto-redirect，
#     而本配置要在 Windows / macOS / Android 共用，auto-redirect 保持 false。
#     留空等于旧行为（Windows/Linux 且 auto-route 时为 hijack，macOS 为 disabled）。
#
# ── 历史版本关键变更（供以后核对）──
# 1. tun.exclude-package 已移除，银行 App 的直连保障靠 rules 里的 PROCESS-NAME-WILDCARD 兜底。
# 2. 全部 MetaCubeX rule-provider 与 geox-url 下载源统一使用官方 MetaCubeX 的 gcore jsDelivr 镜像。
# 3. QUIC 嗅探已关闭（sniffer.sniff.QUIC.enable: false）。P7 的境外 QUIC 封堵靠 RULE-SET,cn-ip,no-resolve 判断。
# 4. 远程控制/内网穿透工具指向"远控工具" select 分组，默认选中 REJECT-DROP。
# 5. log-level 设为 info（换取排查问题的能力，如嫌吵可自行调回 warning）。
# 6. inet4-route-only 关闭，接管双栈路由防止 IPv6 绕过 TUN 泄露。
# 7. secret 字段是占位符，必须在设备本地生成替换。
# 8. [2026-09 内核对齐 v1.19.31] tun.gso 已由 false 改回 true。
# 9. [2026-09 IPv6 双栈] 全面开启 IPv6 支持。

mode: rule
allow-lan: false
bind-address: "127.0.0.1"
mixed-port: 17890  # 非默认端口，防止本地恶意应用定位
log-level: info    # 日志量最大，换取以后排查问题的能力（权衡：会留存更多本地日志细节）
ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
keep-alive-idle: 15
disable-keep-alive: false
find-process-mode: strict
etag-support: true

external-controller: 127.0.0.1:19090
# secret 留空（注释掉）= 不启用 external-controller 认证。
# 如需启用认证：终端执行 openssl rand -hex 32 生成密钥，填入设备本地配置文件。
# secret: "your-random-secret-here"

# CORS 防护：只允许本地 origin，彻底断绝远程利用路径
external-controller-cors:
  allow-origins:
    - "http://127.0.0.1:19090"
    - "https://127.0.0.1:19090"
    - "http://localhost:19090"
    - "https://localhost:19090"
  allow-private-network: false

profile:
  store-selected: false  # 安全优先：不持久化节点选择，防止代理节点信息被检查
  store-fake-ip: false   # 唯一生效的 fake-ip 持久化开关（安全优先，不持久化访问记录）；需跨重启保持改 true

geodata-mode: false
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 168   # 7天，与 rule-providers interval 协同

geox-url:
  geoip:   "https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb:    "https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  asn:     "https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

# 使用较中性的 Chrome UA，避免在 Windows/macOS 上出现明显的 Android 指纹。
global-ua: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

experimental:
  quic-go-disable-gso: false
  quic-go-disable-ecn: false

# NTP 已禁用（系统自带 NTP 足够，明文 UDP 暴露流量特征）
ntp:
  enable: false
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 30

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: false         # Linux 专属。跨平台（Windows/macOS/Android）必须关闭。因此 dns-mode 也不写 hijack。
  strict-route: true           # 严格路由：防止流量绕过 TUN
  auto-detect-interface: true
  mtu: 1500                    # 标准以太网 MTU，消除 TUN 网卡指纹特征
  gso: true                    # v1.19.30+ 已修复 PackBuffer 重分配问题；若解析异常改回 false
  gso-max-size: 65536
  udp-timeout: 300
  # dns-mode 留空（v1.19.33 可写 disabled/native/hijack）。不要改成 hijack：
  # Linux 上 hijack 依赖上面关掉的 auto-redirect。留空与 v1.19.32 行为一致。
  dns-hijack:
    - any:53
    - tcp://any:53

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      enable: true
      override-destination: true
    TLS:
      ports: [443, 8443]
      enable: true
      override-destination: true
  force-domain:
    - "+.google.com"
    - "+.youtube.com"
    - "+.telegram.org"
    - "+.openai.com"
    - "+.anthropic.com"
    - "+.twitter.com"
    - "+.x.com"
    - "+.googlevideo.com"
    - "+.ytimg.com"
    - "+.chatgpt.com"
    - "+.claude.ai"
    - "+.claude.com"
  # Telegram 官方 IP 段跳过嗅探（MTProto 加密协议，TLS 嗅探会失败产生噪音日志）
  skip-dst-address:
    - "91.105.192.0/23"
    - "91.108.4.0/22"
    - "91.108.8.0/21"
    - "91.108.16.0/21"
    - "91.108.56.0/22"
    - "95.161.64.0/20"
    - "149.154.160.0/20"
    - "185.76.151.0/24"
    # Telegram IPv6 段
    - "2001:b28:f23d::/48"
    - "2001:b28:f23f::/48"
    - "2001:67c:4e8::/48"
  skip-domain:
    - "geosite:cn"
    - "geosite:geolocation-cn"       # 国内域名不做嗅探，减少性能开销
    - "geosite:category-ads-all"
    - "geosite:category-games-cn"    # 国内游戏域名跳过嗅探
    # Android / Windows / Apple 网络连通性检测域名，跳过嗅探防误判
    - "+.gstatic.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.captive.apple.com"
    # 路由器后台管理域名，跳过嗅探防卡顿
