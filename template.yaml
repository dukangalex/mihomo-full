  - DOMAIN-SUFFIX,samsunghealth.com,DIRECT      # 三星健康
  # ── Android/Google 系统服务被误杀 ──────────────────────────────
  - DOMAIN,connectivitycheck.gstatic.com,DIRECT # Android网络连通性检测，必须直连
  - DOMAIN,userlocation.googleapis.com,国外服务  # Google定位API
  - DOMAIN,voilatile-pa.googleapis.com,国外服务  # Google API
  - DOMAIN,geller-pa.googleapis.com,国外服务     # Google助手预测API（日志实测误杀）
  - DOMAIN,mobilemaps-pa-gz.googleapis.com,国外服务  # Google地图API
  # ── Firebase / Microsoft SDK 被误杀 ────────────────────────────
  - DOMAIN-SUFFIX,app-measurement.com,国外服务   # Firebase分析SDK
  - DOMAIN-SUFFIX,firebaselogging.googleapis.com,国外服务  # Firebase日志
  - DOMAIN-SUFFIX,in.appcenter.ms,国外服务       # Microsoft App Center崩溃分析
  - DOMAIN-SUFFIX,mobile.events.data.microsoft.com,国外服务  # 微软遥测
  - DOMAIN-SUFFIX,connect.facebook.net,国外服务  # Facebook SDK
  # ── Anthropic CDN 被误杀 ────────────────────────────────────────
  - DOMAIN-SUFFIX,a-cdn.anthropic.com,AI服务
  - DOMAIN-SUFFIX,assets-proxy.anthropic.com,AI服务
  # ── 微软 Bing 被误杀 ────────────────────────────────────────────
  - DOMAIN-SUFFIX,bing.com,国外服务                 # Bing 搜索（c.bing.com 被误杀）
  # ── 三星推送被误杀 ──────────────────────────────────────────────
  - DOMAIN-SUFFIX,samsungosp.com,DIRECT             # 三星推送服务（含 an-gld.push.samsungosp.com）
  # ── Firebase 崩溃上报被误杀 ─────────────────────────────────────
  - DOMAIN-SUFFIX,crashlytics.com,国外服务          # Firebase Crashlytics（firebase-settings.crashlytics.com）
  - DOMAIN-SUFFIX,firebase.io,国外服务              # Firebase 服务域
  # ── 监控/分析工具 ───────────────────────────────────────────────
  - DOMAIN,browser-intake-us5-datadoghq.com,国外服务

  # P2. 广告 / 安全威胁拦截
  - RULE-SET,sukka-phishing,REJECT-DROP    # 钓鱼域名（13万条）
  - RULE-SET,category-ads-all,🛑 广告拦截  # 默认拦截；需要时可切换 DIRECT
  - DOMAIN,galaxystore.ad-survey.com,REJECT
  - DOMAIN,dls2.bigdata.samsung.com.cn,REJECT

  # P3. 私有 IP 直连
  - RULE-SET,private-ip,DIRECT,no-resolve

  # P4. STUN/TURN 域名精确拦截
  # 当 sniffer 能还原域名时（TCP TLS/HTTP）拦截 stun/turn 域名
  # UDP STUN 流量 sniffer 无法还原域名 → 依赖 P6 端口层兜底
  - DOMAIN-REGEX,^(stun|turn|stuns|turns)\.,REJECT-DROP
  - DOMAIN-REGEX,[-.]stun[-.],REJECT-DROP
  - DOMAIN-REGEX,[-.]turn[-.],REJECT-DROP
  - DOMAIN-REGEX,[-.]stuns[-.],REJECT-DROP
  - DOMAIN-REGEX,[-.]turns[-.],REJECT-DROP

  # P5. DNS 明文泄露封堵
  # REJECT → REJECT-DROP：静默丢包而非返回 TCP RST/ICMP，避免主动暴露
  # "此处存在拦截行为"的可探测特征，与 P2/P6/P7 的隐匿风格保持一致
  - AND,((NETWORK,UDP),(DST-PORT,53),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP
  - AND,((NETWORK,TCP),(DST-PORT,53),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,853),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP
  - AND,((NETWORK,TCP),(DST-PORT,853),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP

  # P5.5 ICMP 封堵已删除：Mihomo AND 规则只支持 TCP/UDP
  #       ICMP ping 泄露风险极低，系统层面 strict-route 已缓解

  # P5.6 明文协议境外封堵（防恶意软件通过代理外联）
  # Telnet:23 / FTP:21 / SMTP:25 / POP3:110 / IMAP:143
  - AND,((NETWORK,TCP),(DST-PORT,21),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP
  - AND,((NETWORK,TCP),(DST-PORT,23),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP
  - AND,((NETWORK,TCP),(DST-PORT,25),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP
  - AND,((NETWORK,TCP),(DST-PORT,110),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP
  - AND,((NETWORK,TCP),(DST-PORT,143),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP

  # P6. STUN/TURN/WebRTC/SSDP/mDNS 端口封堵
  # STUN/TURN 无条件封堵 UDP + TCP 双协议（含国内IP）
  # 原因：STUN 无论走 UDP 还是 TCP，无论服务器在国内还是国外
  # 均可通过 ICE candidate 探测并暴露设备真实 IP
  # UDP 封堵（主路径，WebRTC 默认走 UDP）
  - AND,((NETWORK,UDP),(DST-PORT,3478-3480)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,5349-5355)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,19302-19305)),REJECT-DROP
  # TCP 封堵（STUN/TURN over TCP 备用路径，同样能泄露真实 IP）
  - AND,((NETWORK,TCP),(DST-PORT,3478-3480)),REJECT-DROP
  - AND,((NETWORK,TCP),(DST-PORT,5349-5355)),REJECT-DROP
  - AND,((NETWORK,TCP),(DST-PORT,19302-19305)),REJECT-DROP
  # SSDP/mDNS 仅封堵境外（国内 UPnP/局域网设备发现需要保留）
  - AND,((NETWORK,UDP),(DST-PORT,1900),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,5353),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP

  # P7. QUIC（UDP 443）境内直连 / 境外屏蔽
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,cn-ip)),DIRECT
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((RULE-SET,cn-ip)))),REJECT-DROP

  # P8. 境外伪装段强制代理
  # 54.223.0.0/16 = AWS 中国区含 FCM(port 5229)，被 cn-ip 误收录
  # 157.255.0.0/16 已删除（含微信服务器 IP，强制代理触发弹窗）
  - IP-CIDR,54.223.0.0/16,国外服务,no-resolve
  # 52.80.168.0/24 = 另一段被 cn-ip 误收录的 AWS 地址，三星推送服务
  # (com.sec.spp.push) 直接裸 IP 连接不经过 DNS，域名层规则完全碰不到
  # 它，日志实测连续多次 DIRECT 超时后确认，只能用 IP 段规则修
  - IP-CIDR,52.80.168.0/24,国外服务,no-resolve

