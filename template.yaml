  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # fake-ip-range6：使用 fc00::/18；注意路由层 ULA 直连必须写 fd00::/8 以免覆盖此地址池
  fake-ip-range6: fc00::/18
  cache-max-size: 8192
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false

