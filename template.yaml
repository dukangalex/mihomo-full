proxy-providers:

  provider_entry-J:
    type: http
    url: ""  #前置入口订阅
    interval: 3600
    path: ./proxy_providers/entry_J.yaml
    override:
      client-fingerprint: chrome
      udp: true
      ip-version: ipv4-only
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204  # 纯 IP，无域名解析无 SNI，与 Cloudflare 节点基础设施独立
      interval: 300
      expected-status: 204              # 只接受 204，过滤“能连通但返回异常状态”的节点

  provider_exit:
    type: http
    url: ""  #落地出口订阅
    interval: 3600
    path: ./proxy_providers/exit.yaml
    override:
      client-fingerprint: chrome
      dialer-proxy: "前置优选入口"   # 链式代理：出口经入口转发
      udp: true
      ip-version: ipv4-only
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204  # 纯 IP，无域名解析无 SNI，与 Cloudflare 节点基础设施独立
      interval: 600
      expected-status: 204              # 只接受 204，过滤“能连通但返回异常状态”的节点

proxy-groups:

  - name: "前置优选入口"
    type: url-test
    use: [provider_entry-J]
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 180
    tolerance: 35
    lazy: false
    timeout: 3000
    max-failed-times: 2
    empty-fallback: REJECT #组内节点全灭时会
    # 按 mihomo 默认行为尝试拨号最后已知节点直到超时失败，而不是立即拒绝
    # 参数已优化：更频繁探测 + 更低切换门槛 + 更严格超时，降低入口延迟

  - name: "落地优选出口"
    type: url-test
    use: [provider_exit]
    # exclude-filter 是 mihomo 专门的"排除"字段，跟 filter（筛选保留）
    # 是两个不同的字段，不要混用。之前这里用 filter 硬写
    # "(?i)^(?!.*vmess).*$" 想拿负向先行断言凑排除效果，实测 Vmess
    # 节点照样出现——因为 mihomo 是 Go 写的，Go 标准库正则引擎(RE2)
    # 根本不支持 (?!...) 这种断言语法，这条规则要么编译失败要么被
    # 静默忽略，从头到尾没生效过。exclude-filter 本身就是排除语义，
    # 不需要再套断言语法，直接写要排除的关键词即可。
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 300
    tolerance: 35
    lazy: false
    timeout: 5000
    max-failed-times: 2

  - name: "落地负载均衡"
    type: load-balance
    strategy: consistent-hashing
    # 独立于"落地优选出口"存在，两者并列、互不替代。落地是同一台VPS的
    # 多协议/多端口订阅（同IP），负载均衡在这里换的不是"出口IP更分散"
    # （反正IP一样），而是协议级容灾：某个协议/端口配置万一被针对性
    # 干扰，组内其他协议不受影响。用 consistent-hashing 而不是
    # round-robin：同一个连接的后续请求尽量落在同一个后端配置上，
    # 避免长连接/会话中途换协议造成的不必要抖动。
    # 已加入 AI服务/国外服务/流媒体/漏网之鱼 四个功能分组的可选项。
    # 每个功能分组现支持：落地优选出口（默认）、落地负载均衡、落地手动选择。
    use: [provider_exit]
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 180
    lazy: false
    timeout: 5000

  - name: "落地手动选择"
    type: select
    # 仅暴露落地 VPS 节点，供功能分组手动挑选具体协议/端口。
    # 严格止于落地节点，不包含前置入口、DIRECT、REJECT。
    use: [provider_exit]

  - name: "AI服务"
    type: select
    # 默认「落地优选出口」。可切换负载均衡或进入「落地手动选择」挑选具体节点。
    proxies:
      - 落地优选出口
      - 落地负载均衡
      - 落地手动选择

  - name: "国外服务"
    type: select
    proxies:
      - 落地优选出口
      - 落地负载均衡
      - 落地手动选择

  - name: "流媒体"
    type: select
    proxies:
      - 落地优选出口
      - 落地负载均衡
      - 落地手动选择

  - name: "漏网之鱼"
    type: select
    proxies:
      - 落地优选出口
      - 落地负载均衡
      - 落地手动选择

  - name: "🛑 广告拦截"
    type: select
    # 默认 REJECT-DROP；仅当免费站点依赖广告收入且被误伤/无法正常使用时，
    # 用户才主动切换 DIRECT。此 DIRECT 不是全局直连开关。
    proxies: ["REJECT", "DIRECT"]

  - name: "远控工具"
    type: select
    # 默认 REJECT-DROP；需要使用远控/P2P/内网穿透工具且确认代理冲突时，
    # 用户可主动切换 DIRECT。该 DIRECT 仅属于远控工具局部例外。
    proxies: ["REJECT-DROP", "落地优选出口", "DIRECT"]

#
# 全链路 DNS 架构：
#
#  1) default-nameserver：加密 DoT + 纯 IP，只负责解析 DNS 服务端域名。
#  2) proxy-server-nameserver：专门解析代理节点域名，使用腾讯 DNSPod DoH
#     域名入口 + 阿里公共 DNS IP DoH 双厂商冗余，避免“解析代理节点需要先走代理”。
#  3) nameserver-policy：按国内/境外目标精细选择解析器；国内统一使用同一组
#     CN_DNS，境外关键目标使用 #RULES 的境外 DoH。
#  4) direct-nameserver-follow-policy：DIRECT 出口继续遵循 nameserver-policy。
#  5) 不固定 doh.pub 的 hosts IP：DNSPod 已明确要求移除历史测试/固定 IP hosts，
#     使用标准 DNS 解析 doh.pub，以避免把服务集群 IP 固定死。
#
hosts:
  "dns.alidns.com":
    - "223.5.5.5"
    - "223.6.6.6"
  "doh.pub":
    - "1.12.12.12"
    - "120.53.53.53"
  "dns.google":
    - "8.8.8.8"
    - "8.8.4.4"
  "cloudflare-dns.com":
    - "1.1.1.1"
    - "1.0.0.1"

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-cache-size: 4096
  # fake-ip 持久化只由 profile.store-fake-ip 一个开关控制（见文件头部 profile 段），
  # 原来这里的 dns.fake-ip-persist 字段实测不生效、且与 profile.store-fake-ip:false
  # 相矛盾，已删除避免误导——不要在这里重新加回来。
  ttl: 600
  # "国内流量无感"优化：300s→60s
  # 国内CDN（短视频/直播/下载）常用30-60s短TTL做节点负载均衡和故障切换
  # min-ttl过高会让 mihomo 缓存旧节点IP超过CDN调度周期，
  # 60s 在"减少DNS查询频率"与"及时跟随CDN调度"间取得平衡
  min-ttl: 60
  max-ttl: 3600
  cache-size: 8192
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true              # 开启后 hosts 预解析生效（消除冷启动循环依赖）
  use-system-hosts: false
  disable-qtype-65: true

  # fake-ip-filter rule 模式
  # 顺序：mrs 规则集（最快）→ geosite → 手工精细条目 → MATCH 兜底
  fake-ip-filter-mode: rule
  fake-ip-filter:
    # ── 银行/金融域名最优先（fake-ip 会直接触发银行风控）────────
    - DOMAIN-SUFFIX,abchina.com,real-ip         # 农业银行
