  respect-rules: true
  fast-queries: true
  query-v6: false

  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
    - tls://1.12.12.12
    - tls://120.53.53.53

  # 代理节点 DNS：腾讯 DNSPod DoH 域名 + 阿里公共 DNS IP DoH
  # 不再使用 DNSPod 已下线的固定 IP DoH；TLS/SNI 行为不做“无SNI”假设
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://223.5.5.5/dns-query

  nameserver:
    - "https://dns.google/dns-query#RULES"
    - "https://1.1.1.1/dns-query#RULES"

  direct-nameserver:
    - https://doh.pub/dns-query
    - https://223.5.5.5/dns-query

  direct-nameserver-follow-policy: true

  nameserver-policy:

    "rule-set:cn": &CN_DNS
      - https://doh.pub/dns-query  # 腾讯 DNSPod DoH
