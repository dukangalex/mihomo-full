name: One-shot C/D repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Apply C/D fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, got {n}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          bot = Path('telegram-bot/bot.py')
          s = bot.read_text(encoding='utf-8')
          s = s.replace('import subprocess\nfrom datetime import datetime', 'import subprocess\nimport threading\nfrom datetime import datetime', 1)
          old = '''def restart_bot():
    # Restart after the current Telegram update has been acknowledged. A synchronous
    # restart can terminate this process before the confirmation message is delivered.
    subprocess.Popen(
        ["bash", "-lc", "sleep 1; systemctl restart mihomo-full-bot.service"],
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        start_new_session=True,
    )'''
          new = '''def _restart_service():
    subprocess.Popen(
        ["systemctl", "restart", "mihomo-full-bot.service"],
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        start_new_session=True,
    )


def restart_bot():
    # Delay without a shell so the current Telegram update can be acknowledged.
    t = threading.Timer(1.0, _restart_service)
    t.daemon = True
    t.start()'''
          if s.count(old) != 1:
              raise SystemExit('bot.py: restart block mismatch')
          s = s.replace(old, new, 1)
          marker = 'def vps_report():'
          helper = '''def _run_uninstall_script(script, confirmation):
    p = subprocess.Popen(
        ["bash", str(script)],
        cwd=BASE,
        stdin=subprocess.PIPE,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        start_new_session=True,
        text=True,
    )
    try:
        p.communicate(confirmation + "\\n", timeout=120)
    except Exception:
        try:
            p.kill()
        except Exception:
            pass


def schedule_uninstall(script, confirmation, delay=2.0):
    t = threading.Timer(delay, _run_uninstall_script, args=(script, confirmation))
    t.daemon = True
    t.start()


'''
          if s.count(marker) != 1:
              raise SystemExit('bot.py: vps_report marker mismatch')
          s = s.replace(marker, helper + marker, 1)
          s = re.sub(r'    command = f"sleep 2; printf \'%s\\\\n\' UNINSTALL_BOT \| bash \{uninstall_script\}"\n    subprocess\.Popen\(\["bash", "-lc", command\], cwd=BASE, stdout=subprocess\.DEVNULL,\n                     stderr=subprocess\.DEVNULL, start_new_session=True\)', '    schedule_uninstall(uninstall_script, "UNINSTALL_BOT")', s, count=1)
          s = re.sub(r'    command = f"sleep 2; printf \'%s\\\\n\' UNINSTALL \| bash \{uninstall_script\}"\n    subprocess\.Popen\(\["bash", "-lc", command\], cwd=BASE, stdout=subprocess\.DEVNULL,\n                     stderr=subprocess\.DEVNULL, start_new_session=True\)', '    schedule_uninstall(uninstall_script, "UNINSTALL")', s, count=1)
          if 'bash", "-lc"' in s:
              raise SystemExit('bot.py: bash -lc remains')
          bot.write_text(s, encoding='utf-8')

          # D: public config points at a local server-side source endpoint.
          replace_once('generate.sh',
              'replace_literal "$FULL_CONFIG" \'__AIRPORT_SUB_URL__\' "$AIRPORT_SUB_URL"\nreplace_literal "$FULL_CONFIG" \'__EXIT_NODES_URL__\' "$EXIT_URL"',
              'AIRPORT_PROXY_URL="https://${DOMAIN}${FIXED_FULL_CONFIG_PATH}/source"\nreplace_literal "$FULL_CONFIG" \'__AIRPORT_SUB_URL__\' "$AIRPORT_PROXY_URL"\nreplace_literal "$FULL_CONFIG" \'__EXIT_NODES_URL__\' "$EXIT_URL"\nif grep -Fq "$AIRPORT_SUB_URL" "$FULL_CONFIG"; then err "真实机场订阅 URL 意外进入公网 full-config.yaml，拒绝发布"; fi')

          # Audit rejects any raw upstream URL variable leaking into the public file.
          replace_once('tools/audit-generated-config.sh',
              'grep -qF \'provider_entry_J:\' "$CONFIG" || fail "缺少前置机场 provider"',
              'if grep -qF \'AIRPORT_SUB_URL\' "$CONFIG" || grep -qF \'REPLACE_WITH_YOUR_AIRPORT_SUBSCRIPTION_URL\' "$CONFIG"; then fail "最终公网配置包含机场订阅变量/占位符"; fi\ngrep -qF \'provider_entry_J:\' "$CONFIG" || fail "缺少前置机场 provider"')

          # install.sh generates the Nginx server-side proxy. The real URL is kept
          # in the root-only settings file and never placed in full-config.yaml.
          replace_once('install.sh',
              'location /assets/ {\n    return 404;\n}',
              '''location = ${FULL_PATH}/source {
    proxy_pass "${AIRPORT_SUB_URL}";
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition "inline";
}
location /assets/ {
    return 404;
}''')
          replace_once('install.sh', 'chmod 644 "$SNIPPET_FILE"', 'chmod 600 "$SNIPPET_FILE"')

          # generate.sh refreshes the Nginx proxy whenever the live installation is regenerated.
          replace_once('generate.sh',
              'chmod 644 "$FULL_CONFIG" "$EXIT_NODES" 2>/dev/null || true',
              '''NGINX_SNIPPET_FILE="/etc/nginx/snippets/mihomo-full-assets.conf"
if [[ -f "$NGINX_SNIPPET_FILE" && "$SCRIPT_DIR" == "/opt/mihomo-full" ]]; then
  CA_BUNDLE="/etc/ssl/certs/ca-certificates.crt"
  [[ -f "$CA_BUNDLE" ]] || err "找不到系统 CA bundle，拒绝启用机场 HTTPS 上游代理"
  NGINX_TMP="${NGINX_SNIPPET_FILE}.tmp"
  AIRPORT_UPSTREAM="$AIRPORT_SUB_URL" CA_BUNDLE="$CA_BUNDLE" FULL_PATH="$FIXED_FULL_CONFIG_PATH" EXIT_PATH="$FIXED_EXIT_NODES_PATH" INSTALL_DIR="$SCRIPT_DIR" python3 - "$NGINX_TMP" <<'PY'
import os, sys
from pathlib import Path

def q(v):
    return v.replace('\\\\', '\\\\\\\\').replace('"', '\\\\"').replace('$', '\\\\$')

a=os.environ['AIRPORT_UPSTREAM']
out=f'''# Managed by mihomo-full
# BEGIN mihomo-full managed assets
location = {os.environ['FULL_PATH']} {{
    alias {os.environ['INSTALL_DIR']}/output/full-config.yaml;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "inline";
}}
location = {os.environ['EXIT_PATH']} {{
    alias {os.environ['INSTALL_DIR']}/output/exit-nodes.yaml;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "inline";
}}
location = {os.environ['FULL_PATH']}/source {{
    proxy_pass "{q(a)}";
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate {os.environ['CA_BUNDLE']};
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition "inline";
}}
location /assets/ {{
    return 404;
}}
# END mihomo-full managed assets
'''
Path(sys.argv[1]).write_text(out, encoding='utf-8')
os.chmod(sys.argv[1], 0o600)
PY
  mv -- "$NGINX_TMP" "$NGINX_SNIPPET_FILE"
fi
chmod 644 "$FULL_CONFIG" "$EXIT_NODES" 2>/dev/null || true''')
          PY

      - name: Validate and commit
        run: |
          python3 -m py_compile telegram-bot/bot.py
          bash -n generate.sh install.sh tools/audit-generated-config.sh
          grep -q 'AIRPORT_PROXY_URL=' generate.sh
          ! grep -q 'bash", "-lc"' telegram-bot/bot.py
          grep -q 'location = ${FULL_PATH}/source' install.sh
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generate.sh install.sh telegram-bot/bot.py tools/audit-generated-config.sh
          git rm .github/workflows/one-shot-fix-cd.yml
          git commit -m "fix C/D: harden bot shell execution and hide airport URL"
          git push
