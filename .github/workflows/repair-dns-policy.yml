name: Repair DNS policy

on:
  push:
    paths:
      - '.github/workflows/repair-dns-policy.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize all DNS policy resolver URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('template.yaml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://dns.alidns.com/dns-query', 'https://223.5.5.5/dns-query')
          s = s.replace('https://120.53.53.53/dns-query', 'https://doh.pub/dns-query')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- template.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template.yaml
          git commit -m 'fix: normalize all DNS policy resolver endpoints'
          git push
