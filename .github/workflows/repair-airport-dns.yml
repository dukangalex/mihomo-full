name: Repair airport DNS consistency

on:
  push:
    paths:
      - '.github/workflows/repair-airport-dns.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize airport override DNS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('airport_overwrite.js')
          s = p.read_text(encoding='utf-8')
          old = 'https://dns.alidns.com/dns-query'
          new = 'https://223.5.5.5/dns-query'
          count = s.count(old)
          if count == 0:
              print('No legacy dns.alidns.com endpoint remains.')
          else:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print('Replaced', count, 'legacy AliDNS hostname DoH references.')
          PY
      - name: Commit normalized script
        run: |
          if git diff --quiet -- airport_overwrite.js; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airport_overwrite.js
          git commit -m 'fix: align airport DNS resolver endpoints'
          git push
