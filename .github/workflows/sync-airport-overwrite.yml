name: Sync airport overwrite
on:
  push:
    paths:
      - 'template.yaml'
      - 'airport_overwrite.js'
      - 'tools/sync-airport-overwrite.py'
      - 'tools/static-audit.py'
      - '.airport-sync-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Harden airport synchronization in working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files={p:Path(p).read_text(encoding='utf-8') for p in ['tools/sync-airport-overwrite.py','tools/static-audit.py','template.yaml']}
          s=files['tools/sync-airport-overwrite.py']
          old="    for group in required_groups:\n        yaml_name = 'name: \"' + group + '\"'\n        json_name = '\"name\": \"' + group + '\"'\n        if yaml_name not in text and json_name not in text:\n            raise RuntimeError(\"required airport group missing: \" + group)\n"
          new="    for group in required_groups:\n        if ('\"' + group + '\"') not in text and (\"'\" + group + \"'\") not in text:\n            raise RuntimeError(\"required airport group missing: \" + group)\n"
          if old in s:s=s.replace(old,new,1)
          old2="    start=text.find('  var AUTO_NAME = \"♻️ 自动选择\";')\n"
          new2="    start=text.find('  var AUTO_NAME = \"♻️ 自动选择\";')\n    if start < 0:\n        start=text.find('  var AUTO_NAME = \"⚡ 自动选择\";')\n"
          if old2 in s:s=s.replace(old2,new2,1)
          s=s.replace('var privateGroup = { name: "🏠 私有网络"','var privateNetworkGroup = { name: "🏠 私有网络"',1)
          s=s.replace('var domesticGroup = { name: "🔒 国内服务"','var domesticServiceGroup = { name: "🔒 国内服务"',1)
          anchor='  var googleGroup = { name: "🔍 谷歌服务", type: "select", proxies: [SELECT_NAME, AUTO_NAME, "DIRECT"], icon: "" };\n'
          remote='  var remoteToolGroup = { name: "🔧 远控工具", type: "select", proxies: ["REJECT-DROP", "DIRECT"], icon: "" };\n'
          if remote not in s:s=s.replace(anchor,anchor+remote,1)
          s=s.replace('privateGroup, domesticGroup, telegramGroup','privateNetworkGroup, domesticServiceGroup, remoteToolGroup, telegramGroup',1)
          s=s.replace('"远控工具":"🌐 非中国"','"远控工具":"🔧 远控工具"',1)
          oldorder='    result=apply_airport_strategy_groups(result)\n    result=map_airport_targets(result)\n'
          neworder='    result=apply_airport_strategy_groups(result)\n    result=upsert_object(result, "rules", template["rules"])\n    result=map_airport_targets(result)\n'
          if oldorder in s:s=s.replace(oldorder,neworder,1)
          files['tools/sync-airport-overwrite.py']=s
          a=files['tools/static-audit.py']
          mapping={
            '🤖 AI服务':'@AI','AI服务':'@AI','💬 AI 服务':'@AI',
            '🌍 国外服务':'@NONCN','国外服务':'@NONCN','🌐 非中国':'@NONCN',
            '📺 Media':'@STREAM','流媒体':'@STREAM','🎬 流媒体':'@STREAM',
            '🐟 漏网之鱼':'@FALLBACK','漏网之鱼':'@FALLBACK',
            '🔧 远控工具':'@REMOTE','远控工具':'@REMOTE',
            '🛑 广告拦截':'@AD','广告拦截':'@AD',
            '🏠 私有网络':'@PRIVATE','私有网络':'@PRIVATE',
            '🔒 国内服务':'@DOMESTIC','国内服务':'@DOMESTIC',
            '📺 哔哩哔哩':'@BILIBILI','哔哩哔哩':'@BILIBILI','Bilibili':'@BILIBILI',
            '📹 油管视频':'@YOUTUBE','📺 YouTube':'@YOUTUBE','油管视频':'@YOUTUBE','YouTube':'@YOUTUBE',
            '🔍 谷歌服务':'@GOOGLE','🔍 Google':'@GOOGLE','谷歌服务':'@GOOGLE','Google':'@GOOGLE',
            '🐱 Github':'@GITHUB','Github':'@GITHUB','GitHub':'@GITHUB',
            '📲 电报消息':'@TELEGRAM','📲 Telegram':'@TELEGRAM','Telegram':'@TELEGRAM',
            'Ⓜ️ 微软服务':'@MICROSOFT','🪟 Microsoft':'@MICROSOFT','微软服务':'@MICROSOFT','Microsoft':'@MICROSOFT',
            '🍏 苹果服务':'@APPLE','🍎 Apple':'@APPLE','苹果服务':'@APPLE','Apple':'@APPLE',
            '🌐 社交媒体':'@SOCIAL','📱 TikTok':'@SOCIAL','🐦 Twitter':'@SOCIAL','社交媒体':'@SOCIAL',
            '🎬 流媒体':'@STREAM','🎵 Spotify':'@STREAM','Spotify':'@STREAM','奈飞视频':'@STREAM','Netflix':'@STREAM',
            '🎮 游戏平台':'@GAMES','🎮 Steam':'@GAMES','游戏平台':'@GAMES','Steam':'@GAMES',
            '📚 教育资源':'@EDUCATION','教育资源':'@EDUCATION',
            '💰 金融服务':'@FINANCE','金融服务':'@FINANCE',
            '☁️ 云服务':'@CLOUD','云服务':'@CLOUD',
          }
          literal='RULE_TARGET_REVERSE = '+repr(mapping).replace("'",'\"')
          a=re.sub(r'^RULE_TARGET_REVERSE = .*$',literal,a,count=1,flags=re.MULTILINE)
          semantic="""def canonicalize_airport_rules(rules):
    out = []
    for rule in rules or []:
        if not isinstance(rule, str): out.append(rule); continue
        parts = rule.split(',')
        if len(parts) >= 2:
            idx = -2 if parts[-1] == 'no-resolve' and len(parts) >= 3 else -1
            parts[idx] = RULE_TARGET_REVERSE.get(parts[idx], parts[idx])
            rule = ','.join(parts)
        out.append(rule)
    return out

def rule_shape(rule):
    if not isinstance(rule, str): return rule
    parts = rule.split(',')
    if len(parts) < 2: return rule
    idx = -2 if parts[-1] == 'no-resolve' and len(parts) >= 3 else -1
    return tuple(parts[:idx] + parts[idx + 1:])
"""
          a=re.sub(r'def canonicalize_airport_rules\(rules\):.*?return out\n',semantic,a,count=1,flags=re.S)
          cmp_block="""airport_rules = extract_json_assignment(airport, "rules")
template_rules = template.get("rules") or []
if [rule_shape(r) for r in airport_rules] != [rule_shape(r) for r in template_rules]:
    errors.append("airport common object drift: rules (rule match structure changed)")
allowed_targets = builtins | {"MATCH"} | {"DIRECT", "REJECT-DROP"}
for rule in airport_rules:
    if not isinstance(rule, str): continue
    parts = rule.split(',')
    idx = -2 if parts[-1] == "no-resolve" and len(parts) >= 3 else -1
    target = parts[idx] if parts else ""
    if target and target not in allowed_targets and target not in RULE_TARGET_REVERSE:
        errors.append(f"airport rules contain unapproved target {target!r}")
"""
          a=re.sub(r'if canonicalize_airport_rules\(extract_json_assignment\(airport, "rules"\)\) != .*?errors\.append\("airport common object drift: rules \(outside approved target mappings\)"\)',cmp_block.rstrip(),a,count=1,flags=re.S)
          files['tools/static-audit.py']=a
          t=files['template.yaml']
          if 'DOMAIN-SUFFIX,claude.ai,AI服务' not in t:t=t.replace('\nrules:\n','\nrules:\n  - DOMAIN-SUFFIX,claude.ai,AI服务\n',1)
          files['template.yaml']=t
          for p,v in files.items():Path(p).write_text(v,encoding='utf-8')
          PY
          python -m py_compile tools/sync-airport-overwrite.py tools/static-audit.py
      - name: Synchronize airport overwrite
        run: python tools/sync-airport-overwrite.py
      - name: Validate JavaScript syntax
        run: node --check airport_overwrite.js
      - name: Run static repository audit
        run: python tools/static-audit.py
      - name: Commit generated synchronization
        run: |
          if git diff --quiet -- template.yaml airport_overwrite.js tools/sync-airport-overwrite.py tools/static-audit.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template.yaml airport_overwrite.js tools/sync-airport-overwrite.py tools/static-audit.py
          git commit -m 'chore: align airport policy and synchronization audit'
          git push
