name: Sync airport overwrite
# Final behavior baseline: template.yaml is the common source of truth.
# This workflow may materialize the deterministic airport variant, but must
# validate it before committing. Chain-only behavior is the only allowed delta.

on:
  push:
    paths:
      - 'template.yaml'
      - 'airport_overwrite.js'
      - 'tools/sync-airport-overwrite.py'
      - '.airport-sync-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Harden validator in working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/sync-airport-overwrite.py')
          s=p.read_text(encoding='utf-8')
          old='''    for group in required_groups:
        yaml_name = 'name: "' + group + '"'
        json_name = '"name": "' + group + '"'
        if yaml_name not in text and json_name not in text:
            raise RuntimeError("required airport group missing: " + group)
'''
          new='''    for group in required_groups:
        if ('"' + group + '"') not in text and ("'" + group + "'") not in text:
            raise RuntimeError("required airport group missing: " + group)
'''
          if old not in s:
              raise SystemExit('validator block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile tools/sync-airport-overwrite.py
      - name: Synchronize airport overwrite
        run: python tools/sync-airport-overwrite.py
      - name: Validate JavaScript syntax
        run: node --check airport_overwrite.js
      - name: Run static repository audit
        run: python tools/static-audit.py
      - name: Commit generated synchronization
        run: |
          if git diff --quiet -- airport_overwrite.js tools/sync-airport-overwrite.py; then
            echo 'No airport overwrite changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airport_overwrite.js tools/sync-airport-overwrite.py
          git commit -m 'chore: sync airport overwrite with template'
          git push
