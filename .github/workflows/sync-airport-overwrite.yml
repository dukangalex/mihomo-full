name: Sync airport overwrite
# Final behavior baseline: preserve airport UX, map common rule targets, validate syntax.

on:
  push:
    paths:
      - 'template.yaml'
      - 'airport_overwrite.js'
      - 'tools/sync-airport-overwrite.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Synchronize airport overwrite
        run: python tools/sync-airport-overwrite.py
      - name: Validate JavaScript syntax
        run: node --check airport_overwrite.js
      - name: Commit generated synchronization
        run: |
          if git diff --quiet -- airport_overwrite.js; then
            echo 'No airport overwrite changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airport_overwrite.js
          git commit -m 'chore: sync airport overwrite with template [skip ci]'
          git push
