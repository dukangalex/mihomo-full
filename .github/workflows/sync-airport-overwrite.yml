name: Sync airport overwrite
on:
  push:
    paths:
      - 'template.yaml'
      - 'airport_overwrite.js'
      - 'tools/sync-airport-overwrite.py'
      - 'tools/normalize-airport-strategy.py'
      - 'tools/run-static-audit.py'
      - 'tools/static-audit.py'
      - 'tools/test-airport-overwrite.js'
      - '.airport-sync-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Synchronize airport overwrite
        run: python tools/sync-airport-overwrite.py
      - name: Normalize airport strategy groups
        run: python tools/normalize-airport-strategy.py
      - name: Validate JavaScript syntax
        run: node --check airport_overwrite.js
      - name: Run airport regression test
        run: node tools/test-airport-overwrite.js
      - name: Run static repository audit
        run: python tools/run-static-audit.py
      - name: Commit generated synchronization
        run: |
          if git diff --quiet -- template.yaml airport_overwrite.js tools/sync-airport-overwrite.py tools/normalize-airport-strategy.py tools/run-static-audit.py tools/static-audit.py tools/test-airport-overwrite.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template.yaml airport_overwrite.js tools/sync-airport-overwrite.py tools/normalize-airport-strategy.py tools/run-static-audit.py tools/static-audit.py tools/test-airport-overwrite.js
          git commit -m 'fix: align airport strategy group policy'
          git push
