name: v1.19.31 compatibility fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix v1.19.31 compatibility issues
        shell: python
        run: |
          from pathlib import Path

          t = Path('template.yaml').read_text(encoding='utf-8')
          a = Path('airport_overwrite.js').read_text(encoding='utf-8')

          # 1) Remove obsolete/non-v1.19.31 TUN IPv4/IPv6 route-only fields.
          t = t.replace('  # inet4-route-only 改为 false：TUN 同时接管 IPv4 和 IPv6 路由。\n'
                        '  # 原 true 时只接管 IPv4，IPv6 流量会绕过 TUN 绕过规则，是泄露隐患。\n'
                        '  # 现在全面支持 IPv6，TUN 需要接管 IPv6 路由，P1 的 IPv6 规则才能生效。\n'
                        '  inet4-route-only: false\n'
                        '  # inet6-route：显式声明 IPv6 路由接管范围。\n'
                        '  # 默认 ::/0 即全部 IPv6 路由，与 inet4-route-only=false 配合，\n'
                        '  # 确保 IPv6 流量全部经过 TUN，由 rules 层精细化路由。\n'
                        '  inet6-route:\n'
                        '    - "2000::/4"    # 全球单播地址（Global Unicast），覆盖绝大多数公网 IPv6\n', '')

          # 2) Remove unsupported DNS knobs; ipv6: true is the supported IPv6 switch.
          t = t.replace('  respect-rules: true\n  fast-queries: true\n  query-v6: true\n',
                        '  respect-rules: true\n')

          # 3) Make documentation match the actual v1.19.31 configuration.
          t = t.replace('ipv6=true, dns.ipv6=true, query-v6=true,',
                        'ipv6=true, dns.ipv6=true,')
          t = t.replace('dns.ipv6=true, dns.query-v6=true, fake-ip-range6,',
                        'dns.ipv6=true, fake-ip-range6,')
          t = t.replace('    - ipv6: true, dns.ipv6: true, dns.query-v6: true\n',
                        '    - ipv6: true, dns.ipv6: true\n')
          t = t.replace('# TUN inet4-route-only=false（已改），proxy-providers ip-version=dual,',
                        '# TUN auto-route=true + strict-route=true，proxy-providers ip-version=dual,')
          t = t.replace('  # 6. inet4-route-only 改为 false（原为 true）。原设置下 TUN 只接管\n'
                        '  # IPv4 路由，操作系统若有能用的原生 IPv6 出口，IPv6 流量会完全\n'
                        '  # 绕过 TUN、绕过 rules 里 P1 的 IPv6 封堵规则，是个从未被真正\n'
                        '  # 验证过的潜在泄露口——大陆手机 IPv6 部署本就不完整，这条隐患\n'
                        '  # 过去概率低，但现在要在 Windows/macOS 家宽环境用（IPv6 双栈\n'
                        '  # 很常见），风险显著上升，因此关闭。\n',
                        '  # 6. IPv6 由 ipv6=true、TUN auto-route=true + strict-route=true 统一接管，\n'
                        '  # 不再使用旧的 inet4-route-only/inet6-route 私有写法。\n')
          t = t.replace('#    - hosts/default-nameserver 新增 IPv6 地址\n',
                        '#    - hosts/default-nameserver 新增 IPv6 地址\n')

          # 4) Use one canonical geox source. template.yaml remains authoritative.
          geox = {
              'https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat': 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat',
              'https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat': 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat',
              'https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb': 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.metadb',
              'https://gcore.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb': 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb',
          }
          for old, new in geox.items():
              a = a.replace(old, new)

          Path('template.yaml').write_text(t, encoding='utf-8')
          Path('airport_overwrite.js').write_text(a, encoding='utf-8')

          # Hard fail if any known bad field/source remains.
          bad = []
          for token in ('inet4-route-only:', 'inet6-route:', 'query-v6:', 'fast-queries:'):
              if token in t or token in a:
                  bad.append(token)
          for old in geox:
              if old in a:
                  bad.append(old)
          if bad:
              raise SystemExit('Compatibility cleanup incomplete: ' + ', '.join(bad))

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          import yaml
          with open('template.yaml', encoding='utf-8') as f:
              yaml.safe_load(f)
          print('template.yaml: YAML parse OK')
          PY

      - name: Validate JavaScript syntax
        run: node --check airport_overwrite.js

      - name: Validate with official Mihomo v1.19.31
        run: |
          set -euo pipefail
          curl -fsSL -o mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1-v1.19.31.gz
          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo
          ./mihomo -v
          ./mihomo -t -f template.yaml

      - name: Verify common geox values
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t = Path('template.yaml').read_text(encoding='utf-8')
          a = Path('airport_overwrite.js').read_text(encoding='utf-8')
          urls = [
            'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat',
            'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat',
            'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.metadb',
            'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb',
          ]
          for u in urls:
              assert u in t, u + ' missing from template'
              assert u in a, u + ' missing from airport_overwrite.js'
          print('geox common-source check: OK')
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template.yaml airport_overwrite.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: align configs with Mihomo v1.19.31'
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/v131-compat-fix.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time v1.19.31 compatibility workflow' || true
          git push || true
