name: Static repository audit

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Synchronize Airport overwrite
        run: |
          set -euo pipefail
          python tools/sync-airport-overwrite.py
          python tools/normalize-airport-strategy.py
          # Audit only: synchronization is performed in the dedicated
          # sync-airport-overwrite workflow. Do not push from this audit job.
      - name: Verify Airport synchronization and normalization
        run: |
          set -euo pipefail
          python tools/normalize-airport-strategy.py
          node --check airport_overwrite.js
          node tools/test-airport-overwrite.js
      - name: Static behavior audit
        run: python tools/run-static-audit.py
      - name: Endpoint runtime regression audit
        run: python tools/test-endpoint.py
      - name: VPS traffic state regression audit
        run: python tools/test-vps-usage.py
      - name: Shell syntax audit
        run: bash -n generate.sh manage.sh install.sh uninstall.sh update.sh tools/load-settings.sh telegram-bot/install-telegram-bot.sh telegram-bot/uninstall-bot.sh
      - name: Python syntax audit
        run: python -m py_compile tools/sync-airport-overwrite.py tools/normalize-airport-strategy.py tools/run-static-audit.py tools/generate-endpoint.py tools/test-endpoint.py tools/test-vps-usage.py telegram-bot/bot.py telegram-bot/vps_usage.py tools/static-audit.py
      - name: JavaScript syntax audit
        run: node --check airport_overwrite.js
      - name: End-to-end generate.sh regression audit
        run: |
          set -euo pipefail
          FAKE_V2RAY_DIR="$RUNNER_TEMP/fake-v2ray/clashMeta"
          mkdir -p "$FAKE_V2RAY_DIR"
          python3 - "$FAKE_V2RAY_DIR/vless_TCP_inbound.yaml" << 'PY'
          import sys
          lines = [
              '  - name: "CI-Synthetic-Landing-01"',
              '    type: vless',
              '    server: 198.51.100.10',
              '    port: 443',
              '    uuid: 00000000-0000-0000-0000-000000000000',
              '    network: tcp',
              '    tls: true',
              '    servername: example.invalid',
              '    flow: xtls-rprx-vision',
              '    reality-opts:',
              '      public-key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
              '      short-id: abcd1234',
              '    client-fingerprint: chrome',
          ]
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY
          cp settings.conf settings.conf.ci-backup
          trap 'mv -f settings.conf.ci-backup settings.conf 2>/dev/null || true' EXIT
          cat > settings.conf << EOF
          AIRPORT_SUB_URL="https://example.invalid/sub/token"
          FIXED_FULL_CONFIG_PATH="/assets/orange-river-forest-cloud-window-simple-market-basic"
          FIXED_EXIT_NODES_PATH="/assets/violet-stone-garden-summer-quiet-bridge-honest-cover"
          DOMAIN="example.invalid"
          V2RAY_AGENT_CLASHMETA_DIR="$FAKE_V2RAY_DIR"
          OUTPUT_DIR="$RUNNER_TEMP/mf-output"
          EOF
          bash generate.sh
      - name: Validate generated config against real mihomo core
        run: |
          set -euo pipefail
          MIHOMO_VERSION="v1.19.31"
          curl -fsSL -o "$RUNNER_TEMP/mihomo.gz" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip -f "$RUNNER_TEMP/mihomo.gz"
          chmod +x "$RUNNER_TEMP/mihomo"
          mkdir -p "$RUNNER_TEMP/mihomo-test-dir"
          cp "$RUNNER_TEMP/mf-output/full-config.yaml" "$RUNNER_TEMP/mihomo-test-dir/config.yaml"
          "$RUNNER_TEMP/mihomo" -d "$RUNNER_TEMP/mihomo-test-dir" -t
