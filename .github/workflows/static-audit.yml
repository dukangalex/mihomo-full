name: Static repository audit

on:
  push:
    paths:
      - 'template.yaml'
      - 'airport_overwrite.js'
      - 'generate.sh'
      - 'manage.sh'
      - 'install.sh'
      - 'telegram-bot/**'
      - 'tools/**'
      - 'COMMON_BEHAVIOR.md'
      - 'docs/**'
  pull_request:
    paths:
      - 'template.yaml'
      - 'airport_overwrite.js'
      - 'generate.sh'
      - 'manage.sh'
      - 'install.sh'
      - 'telegram-bot/**'
      - 'tools/**'
      - 'COMMON_BEHAVIOR.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Static behavior audit
        run: python tools/static-audit.py
      - name: Shell syntax audit
        run: bash -n generate.sh manage.sh install.sh
      - name: Python syntax audit
        run: python -m py_compile tools/sync-airport-overwrite.py telegram-bot/bot.py tools/static-audit.py
      - name: JavaScript syntax audit
        run: node --check airport_overwrite.js
