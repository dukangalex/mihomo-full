name: One-shot airport configuration synchronization

on:
  # One-time DNS migration workflow. The migration it enforces has already
  # landed and is now covered by the permanent stale-literal scan in
  # tools/static-audit.py. Keeping a push trigger here would race with
  # sync-airport-overwrite.yml, which listens on the same paths and also
  # commits/pushes airport_overwrite.js. Left as workflow_dispatch only so
  # it remains available as a manual, on-demand repair tool.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Sync airport overwrite from template
        run: python3 tools/sync-airport-overwrite.py
      - name: Verify canonical public configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('template.yaml').read_text(encoding='utf-8')
          a = Path('airport_overwrite.js').read_text(encoding='utf-8')

          required = [
              'https://doh.pub/dns-query',
              'https://223.5.5.5/dns-query',
              'https://dns.google/dns-query#RULES',
              'https://1.1.1.1/dns-query#RULES',
              'direct-nameserver-follow-policy: true',
          ]
          for x in required:
              if x not in t or x not in a:
                  raise SystemExit(f'missing canonical DNS value: {x}')

          legacy = [
              'https://' + 'dns.alidns.com/dns-query',
              'https://' + '120.53.53.53/dns-query',
          ]
          for x in legacy:
              if x in a:
                  raise SystemExit(f'legacy DNS value remains in airport_overwrite.js: {x}')

          workflow = Path('.github/workflows/one-shot-airport-dns-sync.yml').read_text(encoding='utf-8')
          for x in legacy:
              if x in workflow:
                  raise SystemExit(f'legacy DNS value remains in synchronization workflow: {x}')

          print('canonical public configuration verification passed')
          PY
      - name: Commit synchronized airport overwrite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airport_overwrite.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: synchronize airport overwrite with template'
          git push
