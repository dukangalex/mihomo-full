name: One-shot airport DNS synchronization

on:
  push:
    paths:
      - '.github/workflows/one-shot-airport-dns-sync.yml'
      - 'template.yaml'
      - 'airport_overwrite.js'
      - 'tools/sync-airport-overwrite.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Sync airport overwrite from template
        run: python3 tools/sync-airport-overwrite.py
      - name: Verify canonical DNS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('template.yaml').read_text(encoding='utf-8')
          a = Path('airport_overwrite.js').read_text(encoding='utf-8')
          required = [
              'https://doh.pub/dns-query',
              'https://223.5.5.5/dns-query',
              'https://dns.google/dns-query#RULES',
              'https://1.1.1.1/dns-query#RULES',
              'direct-nameserver-follow-policy: true',
          ]
          for x in required:
              if x not in t or x not in a:
                  raise SystemExit(f'missing canonical DNS value: {x}')
          for x in ['https://dns.alidns.com/dns-query', 'https://120.53.53.53/dns-query']:
              if x in a:
                  raise SystemExit(f'legacy DNS value remains in airport_overwrite.js: {x}')
          print('airport DNS synchronization verification passed')
          PY
      - name: Commit synchronized airport overwrite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airport_overwrite.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: synchronize airport DNS with template'
          git push
