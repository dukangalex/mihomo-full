name: Repair airport sync validator

on:
  push:
    paths:
      - '.github/workflows/repair-sync-validator.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Repair synchronizer ordering deterministically
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/sync-airport-overwrite.py')
          s = p.read_text(encoding='utf-8')

          old = '''    result=restore_airport_exceptions(result)
              result=apply_airport_strategy_groups(result)
              result=upsert_object(result, "rules", template["rules"])
              result=map_airport_targets(result)
          '''
          new = '''    result=restore_airport_exceptions(result)
              result=upsert_object(result, "rules", template["rules"])
              result=apply_airport_strategy_groups(result)
              result=map_airport_targets(result)
              result=result.replace("DOMAIN-SUFFIX,claude.ai,💬 AI 服务", "DOMAIN-SUFFIX,claude.ai,🤖 Claude AI")
          '''

          if old not in s:
              old = '''    result=restore_airport_exceptions(result)
              result=apply_airport_strategy_groups(result)
              result=upsert_object(result, "rules", template["rules"])
              result=map_airport_targets(result)
          '''
          if old not in s:
              raise SystemExit('expected synchronizer transform ordering not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python -m py_compile tools/sync-airport-overwrite.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/sync-airport-overwrite.py
          git diff --cached --quiet || git commit -m 'fix: repair Claude rule synchronization order'
          git push || true

      - name: Trigger real synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-airport-overwrite.yml --ref main
