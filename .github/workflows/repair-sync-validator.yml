name: Validate airport sync

on:
  push:
    paths:
      - 'template.yaml'
      - 'tools/sync-airport-overwrite.py'
      - 'airport_overwrite.js'
      - 'tools/test-airport-overwrite.js'
      - '.github/workflows/repair-sync-validator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      - name: Validate airport synchronization
        run: python tools/sync-airport-overwrite.py --check

      - name: Validate generated JavaScript
        run: node --check airport_overwrite.js

      - name: Run airport regression tests
        run: node tools/test-airport-overwrite.js

      - name: Check whitespace
        run: git diff --check
