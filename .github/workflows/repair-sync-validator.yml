name: Repair airport sync validator
on:
  push:
    paths:
      - '.github/workflows/repair-sync-validator.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Repair validator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/sync-airport-overwrite.py')
          s=p.read_text(encoding='utf-8')
          pattern=r'    for group in required_groups:\n.*?    if \'name: \\\"🔰 节点选择\\\"\' in text'
          replacement='''    for group in required_groups:
              yaml_name = 'name: "' + group + '"'
              json_name = '"name": "' + group + '"'
              if yaml_name not in text and json_name not in text:
                  raise RuntimeError("required airport group missing: " + group)
          if 'name: "🔰 节点选择"' in text'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('validator block not found')
          p.write_text(s2,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/sync-airport-overwrite.py
          git commit -m 'fix: accept generated strategy group syntax'
          git push