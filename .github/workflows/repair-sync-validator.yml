name: Repair airport sync validator
on:
  push:
    paths:
      - '.github/workflows/repair-sync-validator.yml'
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Repair validator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/sync-airport-overwrite.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          out=[]
          for line in lines:
              if "required airport group missing" in line and "name:" in line:
                  out.extend([
                    "        yaml_name = 'name: \"' + group + '\"'",
                    "        json_name = '\"name\": \"' + group + '\"'",
                    "        if yaml_name not in text and json_name not in text:",
                    "            raise RuntimeError(\"required airport group missing: \" + group)",
                  ])
              else:
                  out.append(line)
          p.write_text('\\n'.join(out)+'\\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/sync-airport-overwrite.py
          git commit -m 'fix: accept generated strategy group syntax' || true
          git push || true
      - name: Trigger real synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-airport-overwrite.yml --ref main