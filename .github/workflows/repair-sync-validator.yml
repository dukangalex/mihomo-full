name: Validate airport sync ordering

on:
  push:
    paths:
      - '.github/workflows/repair-sync-validator.yml'
      - 'template.yaml'
      - 'airport_overwrite.js'
      - 'tools/sync-airport-overwrite.py'
      - 'tools/normalize-airport-strategy.py'
      - 'tools/run-static-audit.py'
      - 'tools/static-audit.py'
      - 'tools/test-airport-overwrite.js'
  pull_request:
    paths:
      - '.github/workflows/repair-sync-validator.yml'
      - 'template.yaml'
      - 'airport_overwrite.js'
      - 'tools/sync-airport-overwrite.py'
      - 'tools/normalize-airport-strategy.py'
      - 'tools/run-static-audit.py'
      - 'tools/static-audit.py'
      - 'tools/test-airport-overwrite.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify synchronizer transform order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("tools/sync-airport-overwrite.py").read_text(encoding="utf-8")
          expected = [
              "result=restore_airport_exceptions(result)",
              'result=upsert_object(result, "rules", remap_airport_rules(template["rules"]))',
              "result=apply_airport_strategy_groups(result)",
              "result=map_airport_targets(result)",
          ]
          positions = [source.find(item) for item in expected]
          if any(position < 0 for position in positions):
              raise SystemExit("Synchronizer is missing a required transformation")
          if positions != sorted(positions):
              raise SystemExit("Synchronizer transformation order is invalid")
          if 'CLAUDE_GROUP = "🤖 Claude"' not in source:
              raise SystemExit("Dedicated Claude routing target is missing")
          if '"claude.ai", "anthropic.com"' not in source:
              raise SystemExit("Claude/Anthropic domain mapping is missing")
          print("Synchronizer order and dedicated Claude mapping verified")
          PY

      - name: Run JavaScript syntax and regression tests
        run: |
          node --check airport_overwrite.js
          node tools/test-airport-overwrite.js

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-input pyyaml

      - name: Run repository static audit
        run: python3 tools/run-static-audit.py
