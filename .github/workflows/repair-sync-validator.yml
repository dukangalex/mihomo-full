name: Repair airport sync validator
on:
  push:
    paths:
      - '.github/workflows/repair-sync-validator.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Repair validator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/sync-airport-overwrite.py')
          s=p.read_text(encoding='utf-8')
          old='''    for group in required_groups:\n        if 'name: \\"'+group+'\\"' not in text: raise RuntimeError(\"required airport group missing: \"+group)\n'''
          new='''    for group in required_groups:\n        if ('name: \\"'+group+'\\"' not in text and 'name: \\' '+group+' \\' ' not in text and ('\\\"name\\\": \\"'+group+'\\"') not in text):\n            raise RuntimeError(\"required airport group missing: \"+group)\n'''
          if old not in s:
              old='''    for group in required_groups:\n        if 'name: \\"'+group+'\\"' not in text: raise RuntimeError(\"required airport group missing: \"+group)\n'''
          if old not in s:
              raise SystemExit('validator target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/sync-airport-overwrite.py
          git commit -m 'fix: accept generated strategy group syntax'
          git push