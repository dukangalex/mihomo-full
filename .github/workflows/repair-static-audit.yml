name: Repair static audit normalization
on:
  push:
    paths:
      - '.github/workflows/repair-static-audit.yml'
      - 'tools/static-audit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Patch static audit for airport post-normalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('tools/static-audit.py')
          s = p.read_text(encoding='utf-8')
          pattern = r'(?m)^\s*elif \(t / "airport_overwrite\\.js"\)\.read_text\(encoding="utf-8"\) != airport: errors\.append\("airport_overwrite\\.js is not synchronized with template\\.yaml; run the synchronizer"\)'
          replacement = '''    elif (t / "airport_overwrite.js").read_text(encoding="utf-8") != airport:
        normalizer = ROOT / "tools" / "normalize-airport-strategy.py"
        if normalizer.exists():
            _norm_file = t / "tools" / "normalize-airport-strategy.py"
            _norm_file.write_text(normalizer.read_text(encoding="utf-8"), encoding="utf-8")
            _norm = subprocess.run(["python3", str(_norm_file)], cwd=t, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
            if _norm.returncode != 0 or (t / "airport_overwrite.js").read_text(encoding="utf-8") != airport:
                errors.append("airport_overwrite.js is not synchronized with template.yaml after Airport strategy normalization")
        else:
            errors.append("airport_overwrite.js is not synchronized with template.yaml; run the synchronizer")'''
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'target static-audit comparison not found (matches={n})')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git diff -- tools/static-audit.py
          rm -f .github/workflows/repair-static-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/static-audit.py .github/workflows/repair-static-audit.yml
          git commit -m 'fix: make static audit aware of airport normalization'
          git push
