# ============================================================
# Mihomo 完整配置 - 用户可配置项
# 只需要修改这里，然后运行 ./generate.sh
# ============================================================

# 机场入口订阅链接（必填）
# 支持 Clash / Mihomo 格式订阅
AIRPORT_SUB_URL="这里填入你的机场订阅链接"

# ---------- 固定对外路径（部署后不要轻易改，改了客户端订阅地址会变）----------

# 完整配置的固定路径（主订阅，客户端只需要导入这个）
# 最终地址示例：https://你的域名/assets/static/a7f3c21e9b
# 故意不带 .yaml 等后缀，避免一眼看出是配置/节点
FIXED_FULL_CONFIG_PATH="/assets/static/a7f3c21e9b"

# 落地节点列表的固定路径（只给完整配置内部的 provider_exit 使用）
# 最终地址示例：https://你的域名/assets/static/e9b2f1a7c3
FIXED_EXIT_NODES_PATH="/assets/static/e9b2f1a7c3"

# 你的域名（用于生成完整的 https 链接，填到模板里）
# 例：example.com  或  sub.example.com
DOMAIN="你的域名.com"

# v2ray-agent 的 clashMeta 节点目录（一般不需要改）
V2RAY_AGENT_CLASHMETA_DIR="/etc/v2ray-agent/subscribe_local/clashMeta"

# 本地输出目录（nginx 会 alias 到这里）
OUTPUT_DIR="/opt/mihomo-full/output"
