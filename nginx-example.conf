# 加入该域名的 server 块；路径勿加 .yaml

location = /assets/static/REPLACE_WITH_RANDOM_20_HEX_FULL {
    alias /opt/mihomo-full/output/full-config.yaml;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "inline";
}

location = /assets/static/REPLACE_WITH_RANDOM_20_HEX_EXIT {
    alias /opt/mihomo-full/output/exit-nodes.yaml;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "inline";
}

location /assets/static/ {
    return 404;
}
