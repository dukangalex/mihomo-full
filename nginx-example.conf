# 把下面内容加入你的 nginx server 块（或单独建一个 server）
# 路径故意不带 .yaml，看起来像普通静态资源/接口，避免一眼识别为节点订阅

location = /assets/static/a7f3c21e9b {
    alias /opt/mihomo-full/output/full-config.yaml;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "inline";
}

location = /assets/static/e9b2f1a7c3 {
    alias /opt/mihomo-full/output/exit-nodes.yaml;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "inline";
}

# 防止直接访问目录
location /assets/static/ {
    return 404;
}
