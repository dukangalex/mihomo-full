# 示例：加入你自己的 HTTPS server 块。
# install.sh 会在安装时生成两个独立的自然语言随机路径；
# 将脚本输出的实际 location 替换下面两个占位路径。
# 路径无 .yaml / .json 后缀，也不包含 proxy/node/sub/config 等技术语义。

location = /assets/REPLACE_WITH_RANDOM_WORD_PATH_FULL {
    alias /opt/mihomo-full/output/full-config.yaml;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "inline";
}

location = /assets/REPLACE_WITH_RANDOM_WORD_PATH_EXIT {
    alias /opt/mihomo-full/output/exit-nodes.yaml;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "inline";
}

# 不开放未知 /assets/ 路径。
location /assets/ {
    return 404;
}
